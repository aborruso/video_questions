[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-questions"
version = "0.2.2"
description = "Video questions: answer questions about YouTube videos with LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "llm",
]

[project.scripts]
vq = "vq.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vq"]
